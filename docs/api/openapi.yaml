        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses: {'200': {description: Balance de prueba en JSON, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRecord'}}}}}
  /accounting/profit-loss:
    get:
      tags: [Compras y finanzas]
      summary: Consultar estado de resultados
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses: {'200': {description: Ingresos, gastos y resultado en JSON, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRecord'}}}}}
  /procurement/suppliers/{id}:
    put:
      tags: [Compras y finanzas]
      summary: Actualizar proveedor
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenericRecord'}
            example: {name: 'Nube Andina S.A.S.', category: CLOUD_HOSTING, contactName: 'Mesa de servicios', email: proveedores@example.com, paymentTermsDays: 45, status: ACTIVE}
      responses: {'200': {description: Proveedor actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRecord'}}}}}
    delete:
      tags: [Compras y finanzas]
      summary: Eliminar proveedor sin órdenes asociadas
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Proveedor eliminado}}
  /procurement/orders/{id}:
    put:
      tags: [Compras y finanzas]
      summary: Actualizar orden de compra en borrador
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenericRecord'}
            example: {supplierId: '00000000-0000-4000-8000-000000005000', description: 'Capacidad cloud', orderedOn: '2026-10-27', expectedOn: '2026-11-10', currency: COP, taxRate: 19, lines: [{description: 'Nodos de observabilidad', quantity: 3, unitPrice: 1850000}]}
      responses: {'200': {description: Orden actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRecord'}}}}}
    delete:
      tags: [Compras y finanzas]
      summary: Eliminar orden en borrador
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Orden eliminada}}
  /procurement/expenses/{id}:
    put:
      tags: [Compras y finanzas]
      summary: Actualizar gasto no pagado
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenericRecord'}
            example: {description: 'Consumo mensual de infraestructura cloud', category: CLOUD_INFRASTRUCTURE, expenseDate: '2026-10-27', currency: COP, amount: 4250000, status: APPROVED}
      responses: {'200': {description: Gasto actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRecord'}}}}}
    delete:
      tags: [Compras y finanzas]
      summary: Eliminar gasto no pagado
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Gasto eliminado}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nexus_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100}
  responses:
    BadRequest:
      description: Datos inválidos.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: Datos inválidos.}
    Unauthorized:
      description: Credenciales inválidas o falta de sesión.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: Credenciales inválidas.}
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: Recurso no encontrado.}
    Conflict:
      description: Transición de estado no permitida.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: Solo se pueden emitir facturas en borrador.}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, MANAGEMENT, COMMERCIAL, FINANCE, IT_OPERATIONS, PMO, TECHNICIAN]}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    UserEnvelope:
      type: object
      properties:
        user:
          allOf:
            - {$ref: '#/components/schemas/User'}
          nullable: true
    UserCreate:
      type: object
      required: [name, email, password, role]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        role: {type: string, enum: [ADMIN, MANAGEMENT, COMMERCIAL, FINANCE, IT_OPERATIONS, PMO, TECHNICIAN]}
    UserUpdate:
      type: object
      required: [name, email, role, status]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, MANAGEMENT, COMMERCIAL, FINANCE, IT_OPERATIONS, PMO, TECHNICIAN]}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    ClientInput:
      type: object
      required: [legalName, nit, industry, contactName, contactEmail, city]
      properties:
        legalName: {type: string, minLength: 2, maxLength: 200}
        nit: {type: string, minLength: 3, maxLength: 30}
        industry: {type: string, minLength: 2, maxLength: 120}
        contactName: {type: string, minLength: 2, maxLength: 160}
        contactPosition: {type: string, nullable: true, maxLength: 120}
        contactEmail: {type: string, format: email}
        contactPhone: {type: string, nullable: true, maxLength: 40}
        city: {type: string, minLength: 2, maxLength: 100}
        address: {type: string, nullable: true, maxLength: 240}
        status: {type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE}
    Client:
      allOf:
        - {$ref: '#/components/schemas/ClientInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
    ProjectInput:
      type: object
      required: [code, name, customerId, serviceType, responsibleLocation]
      properties:
        code: {type: string, minLength: 2, maxLength: 40}
        name: {type: string, minLength: 2, maxLength: 160}
        description: {type: string, nullable: true}
        customerId: {type: string, format: uuid}
        serviceType: {type: string, enum: [SOFTWARE_DEVELOPMENT, INFRASTRUCTURE_SUPPORT, CLOUD_CONSULTING, CYBERSECURITY, MANAGED_MONITORING]}
        status: {type: string, enum: [PLANNED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED], default: PLANNED}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM}
        responsibleUserId: {type: string, format: uuid, nullable: true}
        responsibleLocation: {type: string, enum: [MEDELLIN, BOGOTA, REMOTE_SHARED]}
        startDate: {type: string, format: date, nullable: true}
        estimatedEndDate: {type: string, format: date, nullable: true}
        estimatedBudget: {type: number, minimum: 0, nullable: true}
        estimatedHours: {type: number, minimum: 0, nullable: true}
        progressPercentage: {type: integer, minimum: 0, maximum: 100, default: 0}
    Project:
      allOf:
        - {$ref: '#/components/schemas/ProjectInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            customerName: {type: string}
    PagedUsers:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    PagedClients:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Client'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    PagedProjects:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Project'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    Asset:
      type: object
      description: Registro de activo; puede contener además columnas de inventario y campos extra.
      properties:
        id: {type: string, format: uuid}
        serial_number: {type: string, nullable: true}
        serialNumber: {type: string, nullable: true}
        hostname: {type: string, nullable: true}
        asset_type: {type: string, nullable: true}
        assetType: {type: string, nullable: true}
        status: {type: string}
        siteName: {type: string, nullable: true}
        clientName: {type: string, nullable: true}
        projectName: {type: string, nullable: true}
        ipAddress: {type: string, nullable: true}
        macAddress: {type: string, nullable: true}
    AssetDetail:
      allOf:
        - {$ref: '#/components/schemas/Asset'}
        - type: object
          properties:
            ipAddresses: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
            macAddresses: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
            interfaces: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
            controls: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
            links: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
    PagedAssets:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    NetworkSummary:
      type: object
      properties:
        totalAssets: {type: integer}
        activeAssets: {type: integer}
        assetsWithoutSite: {type: integer}
        assetsWithoutCustomer: {type: integer}
        unassignedAssets: {type: integer}
        infrastructureAssets: {type: integer}
        missingIp: {type: integer}
        missingSerial: {type: integer}
        sites: {type: integer}
        byCategory: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        byCriticality: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        controlCoverage: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        links: {$ref: '#/components/schemas/GenericRecord'}
        openIssues: {type: integer}
    BulkAssignment:
      type: object
      required: [assignment]
      properties:
        filter:
          type: object
          properties:
            siteId: {type: string, format: uuid}
            status: {type: string}
            assetType: {type: string}
            unassigned: {type: boolean, default: true}
        assignment:
          type: object
          minProperties: 1
          properties:
            siteId: {type: string, format: uuid, nullable: true}
            customerId: {type: string, format: uuid, nullable: true}
            projectId: {type: string, format: uuid, nullable: true}
    PagedLinks:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        page: {type: integer}
        pageSize: {type: integer}
    GenericRecord:
      type: object
      description: Objeto JSON con los campos de la fila correspondiente; sus columnas varían por recurso.
      additionalProperties: true
    ItemsEnvelope:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
    PagedGeneric:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        page: {type: integer}
        pageSize: {type: integer}
    Topology:
      type: object
      properties:
        nodes: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
        edges: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
    Impact:
      type: object
      properties:
        failedAssetId: {type: string, format: uuid}
        impactedAssetIds: {type: array, items: {type: string, format: uuid}}
    CustomFieldInput:
      type: object
      required: [key, label, valueType]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        label: {type: string, minLength: 1, maxLength: 120}
        valueType: {type: string, enum: [TEXT, NUMBER, DATE, LIST]}
        options: {type: array, items: {type: string}}
        required: {type: boolean, default: false}
        active: {type: boolean, default: true}
    CollectorConfirmation:
      type: object
      required: [host, port]
      properties:
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
    ContractDetail:
      type: object
      description: Columnas del contrato más scope, con activo/señal y estado de inclusión.
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        status: {type: string}
        customer_name: {type: string}
        scope: {type: array, items: {$ref: '#/components/schemas/GenericRecord'}}
      additionalProperties: true
    WorkOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        description: {type: string, nullable: true}
        status: {type: string}
        customer_id: {type: string, format: uuid, nullable: true}
        site_id: {type: string, format: uuid, nullable: true}
        contract_id: {type: string, format: uuid, nullable: true}
        finding_id: {type: string, format: uuid, nullable: true}
        assigned_user_id: {type: string, format: uuid, nullable: true}
        estimated_hours: {type: number, nullable: true}
        billable: {type: boolean}
        data_origin: {type: string}
      additionalProperties: true
    TimeEntryInput:
      type: object
      required: [entryDate, hours, description]
      properties:
        entryDate: {type: string, format: date}
        hours: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 24}
        description: {type: string, minLength: 2, maxLength: 2000}
    MilestoneInput:
      type: object
      required: [projectId, name, amount]
      properties:
        projectId: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 180}
        description: {type: string, maxLength: 2000}
