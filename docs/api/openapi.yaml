      responses:
        '200':
          description: Capturas recientes y sus indicadores principales.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: '528fb54a-24d2-4d4f-97a7-c6db31c488af', name: captura_iot, sourceFile: captura_iot.xlsx, totalPackets: 148, totalFrameBytes: 32769, totalPayloadBytes: 22857, durationSeconds: 26.722209, payloadEfficiency: 69.7519, importedAt: '2026-10-27T15:00:00.000Z', dataOrigin: IMPORTED}]}
  /iot/captures/import:
    post:
      tags: [Red]
      summary: Importar captura Excel de tráfico IoT/TCP
      description: 'Roles permitidos: ADMIN e IT_OPERATIONS. El libro requiere Resumen, Paquetes, Payloads y Conversaciones; las métricas del resumen se contrastan con las hojas de detalle. Los campos ASCII y hexadecimal de payload no se guardan ni devuelven.'
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema: {type: string, example: captura_iot.xlsx}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: El hash corresponde a una captura ya importada; se devuelve el registro existente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericRecord'}
        '201':
          description: Captura validada y agregados guardados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericRecord'}
              example: {id: '528fb54a-24d2-4d4f-97a7-c6db31c488af', stats: {totalPackets: 148, packetsWithPayload: 57, totalFrameBytes: 32769, totalPayloadBytes: 22857, durationSeconds: 26.722209, payloadEfficiency: 69.7519, payloadCounts: {TEXT: 35, BINARY: 22}, payloadBytesByType: {TEXT: 16094, BINARY: 6763}}, timeSeries: [], portVolumes: []}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {description: Archivo superior a 10 MB.}
        '415': {description: Formato distinto de .xlsx.}
