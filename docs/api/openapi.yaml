openapi: 3.0.3
info:
  title: Nexus Safe-Cloud ERP API
  version: 1.0.0
  description: |
    Contrato de API para presentación. Incluye exclusivamente endpoints consumidos
    por la interfaz activa del MVP. Las respuestas reflejan las estructuras del
    backend; algunos registros incluyen columnas adicionales según los datos.
servers:
  - url: http://localhost:3000/api
    description: Backend local (ajustar puerto/host según backend/.env)
tags:
  - name: Sesión
  - name: Administración
  - name: Clientes y proyectos
  - name: Red
  - name: Servicio gestionado
  - name: Órdenes y horas
  - name: Facturación
  - name: Reportes
  - name: CRM y SaaS
  - name: Compras y finanzas
  - name: Talento humano
security:
  - sessionCookie: []
paths:
  /projects/responsible-users:
    get:
      tags: [Clientes y proyectos]
      summary: Listar usuarios activos para asignación de proyectos
      responses:
        '200':
          description: Usuarios disponibles con id, nombre y rol.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: '00000000-0000-4000-8000-000000000510', name: 'Camila Restrepo', role: ADMIN}]}
  /auth/login:
    post:
      tags: [Sesión]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: admin@nexus.local, password: DemoPassword123!}
      responses:
        '200':
          description: Sesión iniciada; además configura la cookie HttpOnly nexus_session.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Cookie de sesión; el navegador la envía en solicitudes posteriores.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
              example: {user: {id: '0f4e1a72-5b8c-4df0-9b83-7ab231c18a0f', name: Admin, email: admin@nexus.local, role: ADMIN, status: ACTIVE}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Sesión]
      summary: Consultar la sesión actual
      responses:
        '200':
          description: Usuario autenticado o null si no existe sesión.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
              example: {user: {id: '0f4e1a72-5b8c-4df0-9b83-7ab231c18a0f', name: Admin, email: admin@nexus.local, role: ADMIN, status: ACTIVE}}
  /auth/logout:
    post:
      tags: [Sesión]
      summary: Cerrar sesión
      responses:
        '204': {description: Sesión cerrada y cookie eliminada.}
  /users:
    get:
      tags: [Administración]
      summary: Listar usuarios
      description: Solo ADMIN. Sin page/pageSize devuelve un arreglo; con paginación devuelve el sobre indicado.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: search
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Usuarios registrados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedUsers'}
              example: {items: [{id: '0f4e1a72-5b8c-4df0-9b83-7ab231c18a0f', name: Ana Pérez, email: ana@nexus.local, role: ADMIN, status: ACTIVE}], total: 1, page: 1, pageSize: 50}
    post:
      tags: [Administración]
      summary: Crear usuario (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
            example: {name: Ana Pérez, email: ana@nexus.local, password: DemoPassword123!, role: TECHNICIAN}
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
              example: {id: '0f4e1a72-5b8c-4df0-9b83-7ab231c18a0f', name: Ana Pérez, email: ana@nexus.local, role: TECHNICIAN, status: ACTIVE}
        '400': {$ref: '#/components/responses/BadRequest'}
  /users/{id}:
    put:
      tags: [Administración]
      summary: Actualizar usuario (ADMIN)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
            example: {name: Ana Pérez, email: ana@nexus.local, role: TECHNICIAN, status: ACTIVE}
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
              example: {id: '0f4e1a72-5b8c-4df0-9b83-7ab231c18a0f', name: Ana Pérez, email: ana@nexus.local, role: TECHNICIAN, status: ACTIVE}
        '404': {$ref: '#/components/responses/NotFound'}
  /clients:
    get:
      tags: [Clientes y proyectos]
      summary: Listar clientes
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: search
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Clientes; respuesta paginada cuando se envían page/pageSize, arreglo sin ellos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedClients'}
              example: {items: [{id: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', legalName: Clínica Demo, nit: '900123456-7', industry: Salud, contactName: Laura Gómez, contactPosition: Administradora, contactEmail: laura@clinica.example, contactPhone: '+57 300 000 0000', city: Bogotá, address: 'Calle 1 # 2-3', status: ACTIVE}], total: 1, page: 1, pageSize: 50}
    post:
      tags: [Clientes y proyectos]
      summary: Crear cliente (ADMIN o COMMERCIAL)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientInput'}
            example: {legalName: Clínica Demo, nit: '900123456-7', industry: Salud, contactName: Laura Gómez, contactPosition: Administradora, contactEmail: laura@clinica.example, contactPhone: '+57 300 000 0000', city: Bogotá, address: 'Calle 1 # 2-3', status: ACTIVE}
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
              example: {id: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', legalName: Clínica Demo, nit: '900123456-7', industry: Salud, contactName: Laura Gómez, contactPosition: Administradora, contactEmail: laura@clinica.example, contactPhone: '+57 300 000 0000', city: Bogotá, address: 'Calle 1 # 2-3', status: ACTIVE}
        '400': {$ref: '#/components/responses/BadRequest'}
  /clients/{id}:
    put:
      tags: [Clientes y proyectos]
      summary: Actualizar cliente (ADMIN o COMMERCIAL)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientInput'}
            example: {legalName: Clínica Demo, nit: '900123456-7', industry: Salud, contactName: Laura Gómez, contactEmail: laura@clinica.example, city: Bogotá, status: ACTIVE}
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
              example: {id: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', legalName: Clínica Demo, nit: '900123456-7', industry: Salud, contactName: Laura Gómez, contactPosition: null, contactEmail: laura@clinica.example, contactPhone: null, city: Bogotá, address: null, status: ACTIVE}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects:
    get:
      tags: [Clientes y proyectos]
      summary: Listar proyectos
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
        - name: customerId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Proyectos; arreglo sin paginación y sobre paginado al usar page/pageSize.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedProjects'}
              example: {items: [{id: '21f7a812-f1b1-4973-a0cf-bc15818ce243', code: PRJ-001, name: Soporte de red, description: Servicio administrado, customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', customerName: Clínica Demo, serviceType: INFRASTRUCTURE_SUPPORT, status: IN_PROGRESS, priority: HIGH, responsibleLocation: BOGOTA, progressPercentage: 25}], total: 1, page: 1, pageSize: 50}
    post:
      tags: [Clientes y proyectos]
      summary: Crear proyecto
      description: 'Roles permitidos: ADMIN, IT_OPERATIONS, PMO.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectInput'}
            example: {code: PRJ-001, name: Soporte de red, description: Servicio administrado, customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', serviceType: INFRASTRUCTURE_SUPPORT, status: PLANNED, priority: MEDIUM, responsibleLocation: BOGOTA, startDate: '2026-10-01', estimatedEndDate: '2026-12-31', estimatedBudget: 5000000, estimatedHours: 120, progressPercentage: 0}
      responses:
        '201':
          description: Proyecto creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
              example: {id: '21f7a812-f1b1-4973-a0cf-bc15818ce243', code: PRJ-001, name: Soporte de red, description: Servicio administrado, customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', serviceType: INFRASTRUCTURE_SUPPORT, status: PLANNED, priority: MEDIUM, responsibleLocation: BOGOTA, progressPercentage: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
  /projects/{id}:
    put:
      tags: [Clientes y proyectos]
      summary: Actualizar proyecto
      description: 'Roles permitidos: ADMIN, IT_OPERATIONS, PMO.'
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectInput'}
            example: {code: PRJ-001, name: Soporte de red, customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', serviceType: INFRASTRUCTURE_SUPPORT, status: IN_PROGRESS, priority: HIGH, responsibleLocation: BOGOTA, progressPercentage: 25}
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
              example: {id: '21f7a812-f1b1-4973-a0cf-bc15818ce243', code: PRJ-001, name: Soporte de red, customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', serviceType: INFRASTRUCTURE_SUPPORT, status: IN_PROGRESS, priority: HIGH, responsibleLocation: BOGOTA, progressPercentage: 25}
  /network/summary:
    get:
      tags: [Red]
      summary: Obtener indicadores de red
      responses:
        '200':
          description: Totales de activos, enlaces, controles y alertas recientes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkSummary'}
              example: {totalAssets: 76, activeAssets: 74, assetsWithoutSite: 2, assetsWithoutCustomer: 1, unassignedAssets: 1, infrastructureAssets: 60, missingIp: 3, missingSerial: 0, sites: 4, active_assets: 74, unassigned_assets: 1, active_links: 91, byCategory: [{category: NETWORK_INFRASTRUCTURE, count: 60}], byCriticality: [{criticality: HIGH, count: 12}], controlCoverage: [{control: EDR, configured: 4, not_detected: 2, not_applicable: 0}], links: {total: 91, non_functional: 1, unknown_functional: 3, critical: 6}, activeLinks: 91, nonFunctionalLinks: 1, unknownFunctionalLinks: 3, openIssues: 0}
  /network/assets:
    get:
      tags: [Red]
      summary: Consultar inventario de activos
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: search, in: query, schema: {type: string}}
        - {name: siteId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string}}
        - {name: assetType, in: query, schema: {type: string}}
        - {name: criticality, in: query, schema: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW]}}
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: unassigned, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Página de activos y total filtrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedAssets'}
              example: {items: [{id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', serial_number: SW-001, serialNumber: SW-001, hostname: SW-CORE-01, asset_type: SWITCH, assetType: SWITCH, status: ACTIVE, siteName: Sede Bogotá, clientName: Clínica Demo, ipAddress: '10.0.0.1', macAddress: '00:11:22:33:44:55'}], total: 1, page: 1, pageSize: 50}
  /network/assets/{id}:
    get:
      tags: [Red]
      summary: Consultar detalle de un activo
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Activo con direcciones, interfaces, controles y enlaces asociados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetDetail'}
              example: {id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', serial_number: SW-001, hostname: SW-CORE-01, asset_type: SWITCH, status: ACTIVE, ipAddresses: [], macAddresses: [], interfaces: [], controls: [], links: []}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Red]
      summary: Guardar datos adicionales de un activo
      description: Esta operación de interfaz guarda los campos personalizados como un objeto JSON clave/valor.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
            example: {rack: Rack A3, owner: Equipo de infraestructura, warranty_end: '2027-12-31'}
      responses:
        '200':
          description: Activo actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
              example: {id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', serial_number: SW-001, hostname: SW-CORE-01, status: ACTIVE, extra_values: {rack: Rack A3}}
        '404': {$ref: '#/components/responses/NotFound'}
  /network/assets/bulk-assignment:
    post:
      tags: [Red]
      summary: Asignar activos en lote
      description: 'Roles permitidos: ADMIN e IT_OPERATIONS.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkAssignment'}
            example: {filter: {unassigned: true, siteId: '20f7a812-f1b1-4973-a0cf-bc15818ce243'}, assignment: {customerId: '6b30f15e-b0a2-49ad-a520-72f8b99a13a0', projectId: '21f7a812-f1b1-4973-a0cf-bc15818ce243'}}
      responses:
        '200':
          description: Cantidad de activos actualizados.
          content:
            application/json:
              schema: {type: object, properties: {updated: {type: integer}}}
              example: {updated: 12}
  /network/assets/{id}/retire:
    post:
      tags: [Red]
      summary: Retirar un activo del inventario
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Registro del activo con marca de retiro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
              example: {id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', status: RETIRED, extra: {retired_at: '2026-10-26T15:00:00.000Z'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /network/links:
    get:
      tags: [Red]
      summary: Listar enlaces de red
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Enlaces visibles, con seriales de los extremos cuando están disponibles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedLinks'}
              example: {items: [{id: 'eabf604d-a02e-4afd-95d1-c95a0d53de00', source_asset_id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', target_asset_id: 'eacd604d-a02e-4afd-95d1-c95a0d53de00', link_type: ETHERNET, source_serial: SW-001, target_serial: FW-001}], page: 1, pageSize: 50}
  /network/links/{id}/retire:
    post:
      tags: [Red]
      summary: Retirar un enlace
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Registro del enlace marcado como retirado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericRecord'}
              example: {id: 'eabf604d-a02e-4afd-95d1-c95a0d53de00', extra: {retired_at: '2026-10-26T15:00:00.000Z'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /network/topology:
    get:
      tags: [Red]
      summary: Consultar topología para simulación
      description: Devuelve nodos activos y enlaces; la simulación en frontend calcula impacto sin modificar inventario.
      responses:
        '200':
          description: Grafo de red.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Topology'}
              example: {nodes: [{id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', serial_number: SW-001, hostname: SW-CORE-01, asset_type: SWITCH, status: ACTIVE, site_id: '20f7a812-f1b1-4973-a0cf-bc15818ce243', site_name: Sede Bogotá, role: CORE}], edges: [{id: 'eabf604d-a02e-4afd-95d1-c95a0d53de00', source_asset_id: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', target_asset_id: 'eacd604d-a02e-4afd-95d1-c95a0d53de00', link_type: ETHERNET, source_interface: Gi0/1, target_interface: Gi0/1, functional: true}]}
  /network/assets/{id}/impact:
    get:
      tags: [Red]
      summary: Simular caída de un activo
      description: Calcula los activos impactados; no altera el inventario ni el estado operativo.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Identificador del activo simulado y activos impactados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Impact'}
              example: {failedAssetId: 'eb325044-19a2-4a67-9b8e-5d3022a4e701', impactedAssetIds: ['eacd604d-a02e-4afd-95d1-c95a0d53de00']}
        '404': {$ref: '#/components/responses/NotFound'}
  /network/vlans:
    get:
      tags: [Red]
      summary: Listar VLAN
      responses:
        '200':
          description: VLAN y cantidad de activos asociados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: 'c62cc3d8-6165-4ac1-ae6d-91de741a9901', vlan_id: 10, name: Usuarios, subnet: 10.0.10.0/24, gateway: 10.0.10.1, site_id: '20f7a812-f1b1-4973-a0cf-bc15818ce243', site_name: Sede Bogotá, asset_count: 18}]}
  /network/dhcp-pools:
    get:
      tags: [Red]
      summary: Listar pools DHCP activos
      responses:
        '200':
          description: Pools DHCP activos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: 'de09340f-0057-4ee7-bae0-26bc8addc208', name: Pool usuarios, network: 10.0.10.0/24, netmask: 255.255.255.0, gateway: 10.0.10.1, dns: ['1.1.1.1'], active: true}]}
  /network/dhcp-pools/{id}/retire:
    post:
      tags: [Red]
      summary: Retirar pool DHCP
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Pool actualizado con estado inactivo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericRecord'}
              example: {id: 'de09340f-0057-4ee7-bae0-26bc8addc208', name: Pool usuarios, active: false}
        '404': {$ref: '#/components/responses/NotFound'}
  /network/sites:
    get:
      tags: [Red]
      summary: Listar sedes
      responses:
        '200':
          description: Sedes registradas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: '20f7a812-f1b1-4973-a0cf-bc15818ce243', name: Sede Bogotá, city: Bogotá, status: ACTIVE}]}
  /network/imports:
    get:
      tags: [Red]
      summary: Consultar historial de importaciones
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Lotes de importación recientes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedGeneric'}
              example: {items: [{id: '157b4427-873a-480e-b15b-506e85a79a0f', source_file: inventario.xlsx, status: COMPLETED, started_at: '2026-10-26T14:00:00.000Z'}], page: 1, pageSize: 50}
  /network/issues:
    get:
      tags: [Red]
      summary: Consultar novedades de la última importación
      responses:
        '200':
          description: Novedades de validación del lote más reciente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: '2c6eaed9-4870-4c09-98f0-7d8a5f9998b2', sheet: Activos, row_number: 8, severity: WARNING, message: Serial duplicado}]}
  /network/custom-fields:
    get:
      tags: [Red]
      summary: Listar definiciones de campos personalizados
      responses:
        '200':
          description: Campos personalizados de activos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemsEnvelope'}
              example: {items: [{id: 'd6c871cc-e5bd-4ae0-af7a-372b438913cf', field_key: rack, label: Rack, field_type: TEXT, required: false, active: true}]}
    post:
      tags: [Red]
      summary: Crear definición de campo (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldInput'}
            example: {key: rack, label: Rack, valueType: TEXT, required: false, active: true}
      responses:
        '201':
          description: Campo creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericRecord'}
